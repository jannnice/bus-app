services:
  - type: web
    name: bus-backend
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./bus-backend/Dockerfile
    dockerContext: ./bus-backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: LTA_ACCOUNT_KEY
        sync: false
      - key: APP_API_TOKEN
        sync: false
      - key: APP_REQUESTS_PER_MINUTE
        value: 120
