spring.application.name=bus-backend
server.port=${PORT:8080}

# Only the health endpoint is needed by the hosting platform.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# LTA DataMall configuration. The account key is intentionally read from the environment.
lta.api.base-url=https://datamall2.mytransport.sg/ltaodataservice
lta.api.account-key=${LTA_ACCOUNT_KEY:}
lta.api.connect-timeout=2s
lta.api.read-timeout=5s

# Local development remains unauthenticated. The production profile enables this guard.
app.api-access.enabled=false
app.api-access.token=${APP_API_TOKEN:}
app.api-access.requests-per-minute=${APP_REQUESTS_PER_MINUTE:120}
